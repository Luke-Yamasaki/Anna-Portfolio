<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anna Kurihara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main</a>

    <header class="site-header">
      <p class="site-title">Anna Kurihara</p>
    </header>

    <main id="main" class="site-main">
      <section class="hero" aria-label="Featured work">
        <div
          class="carousel"
          tabindex="0"
          aria-roledescription="carousel"
          aria-label="Featured stills"
        >
          <div class="carousel__viewport">
            <ul class="carousel__track">
              <li class="carousel__slide">
                <img src="assets/carousel-01.svg" alt="A lit window in a dark room" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel-02.svg" alt="A red corridor receding into shadow" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel-03.svg" alt="A pale shoreline under an overcast sky" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel-04.svg" alt="Stacked chairs against a studio wall" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel-05.svg" alt="A night street with isolated windows" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel-06.svg" alt="Objects arranged on a studio table" />
              </li>
            </ul>
          </div>
        </div>
        <div class="carousel-controls">
          <button type="button" class="carousel-controls__btn" data-carousel-dir="-1" aria-label="Previous featured still">
            <span aria-hidden="true">←</span>
          </button>
          <button type="button" class="carousel-controls__btn" data-carousel-dir="1" aria-label="Next featured still">
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer"></footer>
    <script src="script.js" defer></script>
  </body>
</html>
