<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anna Kurihara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main</a>

    <header class="site-header">
      <p class="site-title">Anna Kurihara</p>
    </header>

    <main id="main" class="site-main">
      <section class="hero" aria-label="Featured work">
        <div
          class="carousel"
          tabindex="0"
          aria-roledescription="carousel"
          aria-label="Featured stills"
        >
          <div class="carousel__viewport">
            <ul class="carousel__track">
              <li class="carousel__slide">
                <img src="assets/carousel/01-tiana-1.webp" alt="Makeup look, Tiana" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/02-maya-7.webp" alt="Makeup look, Maya" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/03-img-1234-e28702.webp" alt="Editorial makeup look" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/04-franci-3.webp" alt="Makeup look, Franci" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/05-thea-ros-5.webp" alt="Makeup look, Thea Ros" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/06-2024-11-24-ethereal-silhouettes2697.webp" alt="Ethereal Silhouettes" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/07-tiana-12.webp" alt="Makeup look, Tiana" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/08-samsaba03-027-leung-15e95e.webp" alt="Makeup look, Sam Saba" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/09-maeve-look-01-0330-30253d.webp" alt="Maeve look 01" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/10-03172023-test-annasatoshi-0883-835475.webp" alt="Makeup look, Anna Satoshi" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/11-dsc02701-28c86c.webp" alt="Editorial makeup look" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/12-keo-3-3-nm.webp" alt="Makeup look, Keo" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/13-b0a4812-edit-8337ce.webp" alt="Editorial makeup look" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/14-115-148228.webp" alt="Editorial makeup look" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/15-img-6206-2-3ebcb6.webp" alt="Editorial makeup look" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/16-trinity21081.webp" alt="Makeup look, Trinity" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/17-maeve-look-02-0425-r1-285004.webp" alt="Maeve look 02" />
              </li>
              <li class="carousel__slide">
                <img src="assets/carousel/18-keo-2-1-nm.webp" alt="Makeup look, Keo" />
              </li>
            </ul>
          </div>
        </div>
        <div class="carousel-controls">
          <button type="button" class="carousel-controls__btn" data-carousel-dir="-1" aria-label="Previous featured still">
            <span aria-hidden="true">←</span>
          </button>
          <button type="button" class="carousel-controls__btn" data-carousel-dir="1" aria-label="Next featured still">
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <section class="media-grid-section" aria-label="Selected work">
        <div class="media-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="site-footer__bio">
        Anna Kurihara is a Make-up artist based in New York. With a background
        rooted in both Japanese elegance and global fashion trends, Her work is
        a blend of precision, artistry, and innovation.
      </p>
      <div class="site-footer__aside">
        <img
          class="site-footer__portrait"
          src="assets/footer-portrait.webp"
          alt="Anna Kurihara"
        />
        <a class="site-footer__contact" href="mailto:hello@annakurihara.com">
          Contact me
        </a>
      </div>
    </footer>

    <dialog class="work-dialog" aria-labelledby="work-dialog-label">
      <button type="button" class="work-dialog__close" aria-label="Close">
        <span aria-hidden="true">X</span>
      </button>
      <div class="work-dialog__body">
        <button type="button" class="work-dialog__nav" data-dialog-dir="-1" aria-label="Previous work">
          <span aria-hidden="true">←</span>
        </button>
        <div class="work-dialog__center">
          <div class="work-dialog__media"></div>
          <div class="work-dialog__copy">
            <p id="work-dialog-label" class="work-dialog__label"></p>
            <div class="work-dialog__description"></div>
          </div>
        </div>
        <button type="button" class="work-dialog__nav" data-dialog-dir="1" aria-label="Next work">
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </dialog>

    <script src="script.js" defer></script>
  </body>
</html>
